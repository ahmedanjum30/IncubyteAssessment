# Run ACME Pay behind a reverse proxy that already owns ports 80/443 on the host.
#   docker compose -f docker-compose.yml -f deploy/compose.shared-proxy.yml up -d --build
# Set BASE_PATH (e.g. /acme-pay) and EDGE_NETWORK (the proxy's Docker network) in .env,
# then add deploy/Caddyfile.shared-hub to that proxy's site block.
# Service names are prefixed (acme-*) because Docker registers them as DNS names on the
# shared network; a generic name like "web" would shadow the other project's service.

services:
  proxy:
    scale: 0

  acme-api:
    networks: [default, edge]

  acme-web:
    networks: [default, edge]

networks:
  edge:
    name: ${EDGE_NETWORK:?Set EDGE_NETWORK to the proxy's Docker network}
    external: true
