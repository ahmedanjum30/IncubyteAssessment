name: acme-pay

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acme}
      POSTGRES_DB: ${POSTGRES_DB:-acme_pay}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "effective_cache_size=1GB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-acme}:${POSTGRES_PASSWORD:-acme}@db:5432/${POSTGRES_DB:-acme_pay}
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  proxy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
